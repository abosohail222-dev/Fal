function pgStk(){
 if(br===ALL)return ph('✅ الجرد')+needBr();
 let tv=0,to=0,tp=0,tc=0;
 const g=t=>{const a=IT(br).filter(i=>i.t===t);return`<tr class="gr"><td colspan="9">${TYP[t][1]} ${TYP[t][0]}</td></tr>`+a.map(it=>{const s=srow(br,yr,mi,it),ov=s.o*s.P,cv=s.c===undefined?null:s.c*s.P;to+=ov;tp+=s.pv;if(s.v!==null){tv+=s.v;tc+=cv}return`<tr><td><b>${esc(it.n)}</b><small>${esc(it.u)}</small></td><td>${IN(`s:${it.id}:o`,s.o)}</td><td>${V(money(ov))}</td><td>${V(fq(s.p))}</td><td>${V(money(s.pv))}</td><td>${IN(`s:${it.id}:c`,s.c)}</td><td>${V(cv===null?'—':money(cv))}</td><td>${V(s.q===null?'—':fq(s.q))}</td><td>${V(s.v===null?'—':money(s.v))}</td></tr>`}).join('')};
 const rows=g('bean')+g('wh');
 const head=TH('الصنف')+TH('الكمية أول المدة','a')+TH('القيمة أول المدة','a')+TH('المشتريات (الكمية)','b')+TH('قيمة المشتريات','b')+TH('الكمية آخر المدة (الجرد)','c')+TH('القيمة آخر المدة','c')+TH('كمية الاستهلاك','d')+TH('قيمة الاستهلاك','e');
 const foot=`<tfoot><tr><td>الإجمالي</td><td></td><td>${V(money(to))}</td><td></td><td>${V(money(tp))}</td><td></td><td>${V(money(tc))}</td><td></td><td>${V(money(tv))}</td></tr><tr><td colspan="4">إجمالي قيمة المشتريات</td><td>${VS(money(tp))}</td><td colspan="3">إجمالي قيمة الاستهلاك (قبل الهالك)</td><td>${VS(money(tv))}</td></tr></tfoot>`;
 return ph(`✅ الجرد: ${AR[mi]} ${yr}`,btn('xlStk','⬇ Excel')+' ')+`<div class="card"><p class="hint">الجرد للبن وأصناف المستودع فقط. منتجات المطبخ بلا جرد: تُحتسب من فواتيرها كتكلفة بعد خصم هالكها. الكمية أول المدة تُدخل يدوياً أول مرة ثم تأتي تلقائياً من جرد الشهر السابق. المشتريات (الكمية وقيمتها) من صفحة المخزون. الكمية آخر المدة هي جرد آخر الشهر. كمية الاستهلاك = أول المدة + المشتريات − آخر المدة. القيم = الكمية × سعر الشهر (وقيمة المشتريات من الفواتير نفسها). إجمالي قيمة الاستهلاك يحسب الأصناف التي أُدخل جردها فقط. هالك البن والمطبخ يُدخل كرقم من صفحة الهالك ويُضاف لتكلفة المبيعات.</p>${TB(head,rows,foot)}${itemForm()}</div>`;

function cashOpen(b,y,m,dp){const M=S.mo[`${b}|${y}|${m}`];if(M&&has(M.co))return +M.co;if((dp||0)>=24)return 0;let pm=m-1,py=y;if(pm<0){pm=11;py--}return cashRem(b,py,pm,(dp||0)+1)}
function cashRem(b,y,m,dp){const M=S.mo[`${b}|${y}|${m}`],o=cashOpen(b,y,m,dp);if(!M)return o;const c=calc1(b,y,m);return o+c.cash-c.exT-c.adv-num(M.cd)}

async function syncNow(){

 if(syncing){again=true;return}

 try{
  for(const b of S.branches){const id=BID[b];if(!id)continue;
   const ik='i|'+id,js=JSON.stringify(IT(b));
   if(SNAP[ik]!==js&&!(SNAP[ik]===undefined&&js==='[]')){
    const v=await DB.saveItems(id,JSON.parse(js),VER[ik]||0);
    if(v===null||v===undefined){conf=true;await conflictReload(b,'items');continue}
    VER[ik]=v;SNAP[ik]=js}
  }
  for(const k of Object.keys(S.mo)){const[b,y,m]=k.split('|'),id=BID[b];if(!id)continue;const js=JSON.stringify(S.mo[k]);
   if(SNAP[k]===js)continue;

   const v=await DB.saveMonth(id,+y,+m,JSON.parse(js),VER[k]||0);
   if(v===null||v===undefined){conf=true;await conflictReload(b,k);continue}
   VER[k]=v;SNAP[k]=js}
  syncMsg=conf?'⚠ تعارض':'✔ تم الحفظ';
 }catch(e){syncMsg='⚠ تعذّر الحفظ: '+((e&&e.message)||e)}

}
